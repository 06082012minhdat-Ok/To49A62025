<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trang Thông Tin Tổ 4 - Lớp 8A6</title>
  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --admin-color: #dc2626;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    header {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .user-profile {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .user-profile img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
    }
    .badge-admin {
      background: var(--admin-color);
      color: white;
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
    .card {
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }
    .post-form textarea, .post-form input[type="text"] {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
    }
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
    }
    .btn:hover { opacity: 0.9; }
    .btn-danger {
      background: var(--admin-color);
      padding: 4px 8px;
      font-size: 0.8rem;
    }
    .news-item {
      border-bottom: 1px solid #e2e8f0;
      padding: 15px 0;
      position: relative;
    }
    .news-item:last-child { border-bottom: none; }
    .news-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 6px;
    }
    .news-title {
      font-weight: bold;
      font-size: 1.1rem;
      margin-bottom: 4px;
    }
    .file-attachment {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #eff6ff;
      color: #1d4ed8;
      padding: 6px 12px;
      border-radius: 6px;
      text-decoration: none;
      font-size: 0.9rem;
      margin-top: 8px;
    }
    .file-attachment:hover { background: #dbeafe; }
    .actions {
      margin-top: 8px;
      display: flex;
      justify-content: flex-end;
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h2>🔥 Bảng Tin Hot - Tổ 4 Lớp 8A6</h2>
    <div id="auth-section">
      <div id="g_id_onload"
           data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
           data-callback="handleCredentialResponse">
      </div>
      <div class="g_id_signin" data-type="standard"></div>
    </div>
    <div id="user-section" class="user-profile" style="display: none;">
      <img id="user-avatar" src="" alt="Avatar">
      <div>
        <span id="user-name" style="font-weight: bold;"></span>
        <span id="admin-badge" class="badge-admin" style="display: none;">ADMIN</span>
      </div>
      <button class="btn" style="background:#64748b;" onclick="logout()">Đăng xuất</button>
    </div>
  </header>

  <!-- Khung Đăng Tin -->
  <div class="card post-form">
    <h3>Đăng tin / Thông báo mới</h3>
    <input type="text" id="post-title" placeholder="Tiêu đề thông báo...">
    <textarea id="post-content" rows="3" placeholder="Nội dung thông báo (tự động xóa sau 24h)..."></textarea>
    <input type="text" id="post-file" placeholder="Đường link File / Ảnh đính kèm (nếu có)...">
    <button class="btn" onclick="addNews()">Đăng Tin</button>
  </div>

  <!-- Danh Sách Tin Hot -->
  <div class="card">
    <h3>Tin Tức Cập Nhật</h3>
    <div id="news-list"></div>
  </div>
</div>

<script>
  const ADMIN_EMAIL = "06.08.2012.minhdat@gmail.com";
  let currentUser = null;

  // Giải mã JWT Token từ Google Sign-In
  function parseJwt(token) {
    var base64Url = token.split('.')[1];
    var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
    return JSON.parse(jsonPayload);
  }

  function handleCredentialResponse(response) {
    const data = parseJwt(response.credential);
    currentUser = {
      name: data.name,
      email: data.email,
      picture: data.picture,
      isAdmin: data.email === ADMIN_EMAIL
    };
    updateUIAuth();
  }

  function updateUIAuth() {
    if (currentUser) {
      document.getElementById('auth-section').style.display = 'none';
      document.getElementById('user-section').style.display = 'flex';
      document.getElementById('user-avatar').src = currentUser.picture;
      document.getElementById('user-name').innerText = currentUser.name;
      if (currentUser.isAdmin) {
        document.getElementById('admin-badge').style.display = 'inline-block';
      }
    } else {
      document.getElementById('auth-section').style.display = 'block';
      document.getElementById('user-section').style.display = 'none';
      document.getElementById('admin-badge').style.display = 'none';
    }
    renderNews();
  }

  function logout() {
    currentUser = null;
    updateUIAuth();
  }

  // Tự động quét và lọc xóa các tin nhắn quá 24h
  function cleanExpiredNews() {
    let list = JSON.parse(localStorage.getItem('to4_news') || '[]');
    const now = Date.now();
    const ONE_DAY_MS = 24 * 60 * 60 * 1000; // 24 giờ
    const filteredList = list.filter(item => (now - item.timestamp) < ONE_DAY_MS);
    localStorage.setItem('to4_news', JSON.stringify(filteredList));
    return filteredList;
  }

  function addNews() {
    if (!currentUser) {
      alert("Vui lòng đăng nhập Google để đăng tin!");
      return;
    }
    const title = document.getElementById('post-title').value.trim();
    const content = document.getElementById('post-content').value.trim();
    const fileUrl = document.getElementById('post-file').value.trim();

    if (!title || !content) {
      alert("Vui lòng nhập đầy đủ tiêu đề và nội dung.");
      return;
    }

    const newItem = {
      id: Date.now(),
      title: title,
      content: content,
      fileUrl: fileUrl,
      authorName: currentUser.name,
      authorEmail: currentUser.email,
      timestamp: Date.now()
    };

    let list = JSON.parse(localStorage.getItem('to4_news') || '[]');
    list.unshift(newItem);
    localStorage.setItem('to4_news', JSON.stringify(list));

    // Reset Form
    document.getElementById('post-title').value = '';
    document.getElementById('post-content').value = '';
    document.getElementById('post-file').value = '';

    renderNews();
  }

  function deleteNews(id) {
    if (!currentUser || !currentUser.isAdmin) {
      alert("Chỉ Quản trị viên (06.08.2012.minhdat@gmail.com) mới có quyền xóa tin!");
      return;
    }
    if (confirm("Bạn có chắc chắn muốn xóa tin nhắn này ngay lập tức?")) {
      let list = JSON.parse(localStorage.getItem('to4_news') || '[]');
      list = list.filter(item => item.id !== id);
      localStorage.setItem('to4_news', JSON.stringify(list));
      renderNews();
    }
  }

  function renderNews() {
    const list = cleanExpiredNews();
    const container = document.getElementById('news-list');
    container.innerHTML = '';

    if (list.length === 0) {
      container.innerHTML = '<p style="color: #94a3b8;">Chưa có thông báo nào trong 24h qua.</p>';
      return;
    }

    list.forEach(item => {
      const dateStr = new Date(item.timestamp).toLocaleString('vi-VN');
      const hasFile = item.fileUrl && item.fileUrl.length > 0;
      
      const html = `
        <div class="news-item">
          <div class="news-header">
            <span>👤 <strong>${item.authorName}</strong></span>
            <span>• ${dateStr}</span>
          </div>
          <div class="news-title">${item.title}</div>
          <div>${item.content}</div>
          ${hasFile ? `
            <a href="${item.fileUrl}" target="_blank" class="file-attachment" download>
              📥 <strong>Tải file / Xem đính kèm</strong>
            </a>
          ` : ''}
          ${(currentUser && currentUser.isAdmin) ? `
            <div class="actions">
              <button class="btn btn-danger" onclick="deleteNews(${item.id})">🗑️ Xóa (Admin)</button>
            </div>
          ` : ''}
        </div>
      `;
      container.innerHTML += html;
    });
  }

  // Khởi chạy khi tải trang
  renderNews();
</script>

</body>
</html>
